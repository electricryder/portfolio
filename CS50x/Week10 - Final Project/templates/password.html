{% extends "layout.html" %}
{% block main %}

  <div class="section-title">Change Password</div>

  <div class="panel" style="max-width: 520px;">
    <form method="post">
      <label class="form-label" style="text-transform:uppercase; letter-spacing:0.08em; font-weight:800;">
        Current password
      </label>
      <input class="form-control mb-3" name="current_password" type="password" autocomplete="current-password">

      <label class="form-label" style="text-transform:uppercase; letter-spacing:0.08em; font-weight:800;">
        New password
      </label>
      <input class="form-control mb-3" name="new_password" type="password" autocomplete="new-password">

      <label class="form-label" style="text-transform:uppercase; letter-spacing:0.08em; font-weight:800;">
        Confirm new password
      </label>
      <input class="form-control mb-3" name="confirm_password" type="password" autocomplete="new-password">

      <button class="btn btn-primary" type="submit">Update</button>
      <a class="btn btn-outline-primary ms-2" href="/member">Cancel</a>
    </form>
  </div>

{% endblock %}
