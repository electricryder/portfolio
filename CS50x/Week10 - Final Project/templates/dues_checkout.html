{% extends "layout.html" %}
{% block main %}

  <div class="section-title">Dues Payment</div>

  <div class="panel" style="max-width: 720px;">
    <div style="text-transform:uppercase; letter-spacing:0.12em; font-weight:900;">Confirm payment</div>

    <hr class="hr-white">

    <div>Months: <strong>{{ months }}</strong></div>
    <div class="mt-2">Total: <strong>{{ total_cents | eur }}</strong></div>

    <div class="mt-3 panel">
      This is a simulated payment screen. Clicking confirm will extend your dues.
    </div>

    <form method="post" action="/dues/pay" class="mt-3">
      <input type="hidden" name="months" value="{{ months }}">
      <button class="btn btn-primary" type="submit">Confirm payment</button>
      <a class="btn btn-outline-primary ms-2" href="/dues">Cancel</a>
    </form>
  </div>

{% endblock %}
