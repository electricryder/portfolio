{% extends "layout.html" %}
{% block main %}

  <div class="section-title">Member Login</div>

  <div class="panel" style="max-width: 520px;">
    <form method="post">
      <input type="hidden" name="next" value="{{ next }}">

      <label class="form-label" style="text-transform:uppercase; letter-spacing:0.08em; font-weight:800;">Email</label>
      <input class="form-control mb-3" name="email" type="email" autocomplete="email">

      <label class="form-label" style="text-transform:uppercase; letter-spacing:0.08em; font-weight:800;">Password</label>
      <input class="form-control mb-3" name="password" type="password" autocomplete="current-password">

      <button class="btn btn-primary" type="submit">Login</button>
      <a class="btn btn-outline-primary ms-2" href="/events">Back</a>
    </form>
  </div>

{% endblock %}
